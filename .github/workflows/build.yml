name: Build VOID Premium

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Bağımlılıkları kur
        run: npm ci

      - name: Testleri çalıştır
        run: npm test

      - name: Windows installer üret
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Installer'ı artifact olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: VOID-Premium-Setup
          path: dist/VOID-Premium-Setup-*.exe

      - name: GitHub Release'e ekle (tag ile tetiklendiyse)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/VOID-Premium-Setup-*.exe
